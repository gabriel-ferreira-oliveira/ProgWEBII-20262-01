<div class="tela-dividida">
  <section class="tela-dividida__painel-branco">
    @if (form(); as formulario) {
      <form class="form-ceviu" [formGroup]="formulario" (ngSubmit)="cadastrar()">
        <h1 class="form-ceviu__titulo">CADASTRO</h1>

        @for (campo of campos(); track campo.name) {
          <label class="campo-rotulo" [for]="'cadastro-' + campo.name">{{ campo.label }}:</label>
          @if (campo.control === 'textarea') {
            <textarea
              [id]="'cadastro-' + campo.name"
              class="campo-ceviu"
              rows="3"
              [formControlName]="campo.name"
            ></textarea>
          } @else {
            <input
              [id]="'cadastro-' + campo.name"
              class="campo-ceviu"
              [type]="campo.control === 'password' ? 'password' : 'text'"
              [attr.inputmode]="campo.control === 'number' ? 'numeric' : null"
              [attr.autocomplete]="campo.control === 'password' ? 'new-password' : null"
              [formControlName]="campo.name"
            />
          }
        }

        <div class="form-ceviu__botoes form-ceviu__botoes--laterais">
          <button class="btn-ceviu" type="submit" [disabled]="carregando()">Cadastrar</button>
          <button class="btn-ceviu" type="button" (click)="voltar()">Voltar</button>
        </div>

        <button class="btn-ceviu btn-ceviu--secundario form-ceviu__limpar" type="button" (click)="limparCampos()">
          Limpar Campos
        </button>
      </form>
    } @else if (carregandoMetadados()) {
      <div class="form-ceviu">
        <mat-progress-bar mode="indeterminate" />
      </div>
    } @else if (erroMetadados(); as mensagem) {
      <div class="form-ceviu">
        <p class="erro-carregamento">
          {{ mensagem }}
          <button class="btn-ceviu btn-ceviu--secundario" type="button" (click)="recarregarMetadados()">
            Tentar novamente
          </button>
        </p>
      </div>
    }
  </section>

  <section class="tela-dividida__painel-azul">
    <img src="imagens/Logo.png" alt="CÊ VIU SÔ" />
  </section>
</div>
