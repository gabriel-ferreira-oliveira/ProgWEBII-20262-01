<div class="tela-dividida">
  <section class="tela-dividida__painel-azul">
    <img src="imagens/Logo.png" alt="CÊ VIU SÔ" />
  </section>

  <section class="tela-dividida__painel-branco">
    @if (form(); as formulario) {
      <form class="form-ceviu" [formGroup]="formulario" (ngSubmit)="entrar()">
        <h1 class="form-ceviu__titulo">LOGIN</h1>

        @for (campo of campos(); track campo.name) {
          <label class="campo-icone__rotulo" [for]="'login-' + campo.name">
            <img
              [src]="campo.control === 'password' ? 'imagens/icone_senha.png' : 'imagens/icone_login.png'"
              alt=""
              width="30"
              height="30"
            />
            <span>{{ campo.label }}:</span>
          </label>
          <input
            [id]="'login-' + campo.name"
            class="campo-ceviu"
            [type]="campo.control === 'password' ? 'password' : 'text'"
            [attr.autocomplete]="campo.control === 'password' ? 'current-password' : 'username'"
            [formControlName]="campo.name"
          />
        }

        <!-- Sem funcao (D-03/P-01): fica fora do formulario reativo (nao e do contrato). -->
        <label class="lembrar-senha">
          <input type="checkbox" />
          Lembrar senha
        </label>

        <div class="form-ceviu__botoes">
          <button class="btn-ceviu" type="submit" [disabled]="carregando()">Entrar</button>
          <button class="btn-ceviu" type="button" (click)="irParaCadastro()">Cadastrar</button>
        </div>
      </form>
    } @else if (carregandoMetadados()) {
      <div class="form-ceviu">
        <mat-progress-bar mode="indeterminate" />
      </div>
    } @else if (erroMetadados(); as mensagem) {
      <div class="form-ceviu">
        <p class="erro-carregamento">
          {{ mensagem }}
          <button class="btn-ceviu btn-ceviu--secundario" type="button" (click)="recarregarMetadados()">
            Tentar novamente
          </button>
        </p>
      </div>
    }
  </section>
</div>
